 triunic_1_orachav_chavans:0 "@J53 Orachav Chavans"
 triunic_1_orachav_chavansDESCR:0 "Orachav Chavans — which in their language translates to Orachav Riders — are steppe hunters for whom a centaur is not an ally, but game. Using Orachav mobility and knowledge of the terrain, these bands track and destroy the four-legged inhabitants of the prairies methodically and mercilessly. No negotiations, no taming — only lassos, lances, and scorched earth. Their tactics: drive a herd into a ravine, shoot them down with bows, then finish off the rest with flanking charges. It is thanks to such bands that the steppe gradually becomes safe for Orachav settlements."
