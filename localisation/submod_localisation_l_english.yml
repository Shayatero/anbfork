 ameion_conquerers_reform_post_laskaris:0 "Post-Laskaris Conqueror's Council"
 ameion_conquerers_reform_post_laskaris_desc: "Under the successors of the late Laskaris the Conqueror, Ameion has seen a transformative shift in governance. Taychend remains the center of power, where strategic decisions are made by the ruling elite. Regional councils manage day-to-day affairs, fostering cultural diversity within the empire. While military victories secure stability, dissent brews over the neglect of republican values, challenging the balance between military might and civil governance for continued legitimacy and stability."
