 #--------------------SALE-OF-TITLES-------------------
 submod_custom_events.1:0 "The Grand Sale of Titles!"
 submod_custom_events.1.t:0 "The Grand Sale of Titles!"
 submod_custom_events.1.desc:0 "As dawn breaks, excitement fills the air. Royal banners proudly flutter, signaling the awaited event. Representatives gather, carriages lined up by class. Knights ensure order amidst the crowd.\n\nAt the square's heart, a podium awaits the auctioneer. With a grand gesture, proceedings begin. Titles of nobility are presented, each with tales of prestige. Bids rise, social classes vie for nobility.\n\nWhispers of ambition and intrigue abound. Fortunes fluctuate with each bid. As the sun sets, the final gavel falls. Victors emerge, faces reflecting triumph or disappointment.\n\nThus, the kingdom's landscape transforms once more, shaped by noble aspirations."
 submod_custom_events.1.a:0 "Tax meta"
 submod_custom_events.1.b:0 "As you know, the submod is balanced for Serpentspine"
 submod_custom_events.1.c:0 "Zaharonomics"
 submod_custom_events.1.d:0 "Manufactories are not respected"
